manifestSchemaVersion: 3
appId: vnaip-dedup
version: 1.0.2
displayName: "VNAIP Dedup"
description: "Kiểm tra hồ sơ ứng viên tương tự trong hệ thống VNAIP."
publisher:
  id: local-dev
  displayName: "Local Dev"
  contact: dev@local-dev.example

contributes:
  skills: []
  tools:
    - name: check-duplicates
      description: >-
        Kiểm tra mức độ tương đồng giữa một hồ sơ đầu vào (type là ideas,
        solutions hoặc initiatives) và toàn bộ các sáng kiến CÙNG type đã được
        duyệt và index trong VNAIP (có thể loại bớt bằng excludeIds). Không
        bao giờ so sánh chéo giữa các type. Chỉ dành cho service account của
        VNAIP BE; lời gọi từ người gọi khác bị từ chối (403).
        Trả về tối đa 30 sáng kiến giống nhất đã được model chấm, mỗi mục có
        id, điểm số 0..1 (và percent 0..100) cùng lý do. Gọi tool này trước khi
        tạo hồ sơ mới để tránh trùng lặp. Nếu kho sáng kiến vượt giới hạn so
        sánh của tool thì trả lỗi thay vì kết quả thiếu. Caller chịu trách
        nhiệm diễn giải điểm số; đây không phải kết luận trùng lặp cuối cùng.
      route: POST /tools/check-duplicates
      inputSchema: src/schemas/dedup-input.schema.json
      outputSchema: src/schemas/dedup-output.schema.json
      timeoutMs: 15000
      failure_mode: abort

service:
  baseUrl: https://ai-portfolio-project-bujz.onrender.com
health:
  url: https://ai-portfolio-project-bujz.onrender.com/health
  intervalSeconds: 60
environments:
  local:
    service:
      baseUrl: http://localhost:8787
    health:
      url: http://localhost:8787/health
  stg: 
    service:
      baseUrl: https://vnaip-dedup.onrender.com
    health:
      url: https://vnaip-dedup.onrender.com/health
